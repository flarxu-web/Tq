<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        padding: 16px;
        margin: 0;
        color: #1a1a2e;
      }
      label { display: block; font-size: 12px; font-weight: 600; margin: 12px 0 4px; }
      #apiKey, .file-row input[type="file"] { width: 100%; box-sizing: border-box; }
      input[type="password"], input[type="file"] {
        padding: 8px 10px;
        border: 1px solid #d0d4dd;
        border-radius: 6px;
        font-size: 13px;
      }
      .file-row { display: flex; gap: 8px; align-items: center; }
      .file-row input[type="file"] { padding: 6px; }
      button {
        margin-top: 12px;
        padding: 9px 14px;
        border: 0;
        border-radius: 6px;
        background: #0078d4;
        color: #fff;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
      }
      button.secondary { background: #e8eaf0; color: #1a1a2e; width: auto; }
      button:disabled { opacity: 0.5; cursor: not-allowed; }
      #status { margin-top: 10px; font-size: 12px; color: #667085; min-height: 16px; }
      #status.ok { color: #0e7a3d; }
    </style>
  </head>
  <body>
    <label for="apiKey">Gemini API Key</label>
    <input type="password" id="apiKey" placeholder="Paste your key" autocomplete="off" />
    <button id="saveKey" class="secondary">Save Key</button>

    <label for="file">Screenshot</label>
    <div class="file-row">
      <input type="file" id="file" accept="image/*" />
      <button id="convert" disabled>Convert</button>
    </div>
    <p id="status" role="status"></p>

    <script>
      const apiKeyInput = document.getElementById('apiKey');
      const fileInput = document.getElementById('file');
      const convertBtn = document.getElementById('convert');
      const statusEl = document.getElementById('status');

      const say = (msg, ok = false) => {
        statusEl.textContent = msg;
        statusEl.classList.toggle('ok', ok);
      };

      document.getElementById('saveKey').onclick = () => {
        const key = apiKeyInput.value.trim();
        if (!key) { say('Enter a key first.'); return; }
        parent.postMessage({ pluginMessage: { type: 'save-key', key } }, '*');
        say('API key saved.', true);
      };

      fileInput.addEventListener('change', () => {
        convertBtn.disabled = !fileInput.files[0];
        if (fileInput.files[0]) say('Image ready — click Convert.');
        else say('');
      });

      document.getElementById('convert').onclick = () => {
        const file = fileInput.files[0];
        if (!file) { say('Choose an image first.'); return; }
        convertBtn.disabled = true;
        say('Converting… this may take a few seconds.');
        const reader = new FileReader();
        reader.onload = () => {
          const base64 = reader.result.split(',')[1];
          parent.postMessage({ pluginMessage: { type: 'process-image', imageBytes: base64 } }, '*');
        };
        reader.onerror = () => {
          say('Could not read that file.');
          convertBtn.disabled = false;
        };
        reader.readAsDataURL(file);
      };

      window.addEventListener('message', (e) => {
        if (e.data?.pluginMessage?.type !== 'convert-result') return;
        convertBtn.disabled = !fileInput.files[0];
        if (e.data.pluginMessage.ok) say('Design generated — check the Figma canvas.', true);
        else say('Conversion failed — see the Figma notification for details.');
      });
    </script>
  </body>
</html>
